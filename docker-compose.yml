services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traceux
      POSTGRES_PASSWORD: traceux
      POSTGRES_DB: traceux
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceux"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - traceux_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  traceux_postgres:
